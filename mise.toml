[settings]
locked = true

[tools]
"asdf:mise-plugins/mise-ffmpeg" = { version = "9.0.2", install_env = { ASDF_FFMPEG_ENABLE = "libx264", ASDF_FFMPEG_OPTIONS_EXTRA = "--enable-gpl" } }
node = "25.9.0"
python = ["3.12.14", "3.13.15"]
uv = "0.12.18"
"pipx:pre-commit" = "4.6.2"
"pypi:kokoro" = { version = "0.9.4", uvx_args = "--index https://download.pytorch.org/whl/cpu --with https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
"cargo:lychee" = "0.24.2"

[tasks.release]
description = "Prepare a signed release version PR: mise run release X.Y.Z"
run = "uv run scripts/release-version.py prepare"
