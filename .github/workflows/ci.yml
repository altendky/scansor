name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow_ref, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  mise:
    name: Mise
    uses: ./.github/workflows/reflow-mise.yml

  pre-commit:
    name: Pre-commit
    uses: ./.github/workflows/reflow-pre-commit.yml

  python:
    name: Python
    uses: ./.github/workflows/reflow-python.yml

  mesh-numeric:
    name: Mesh numerical conformance
    uses: ./.github/workflows/reflow-mesh-numeric.yml

  all:
    name: all
    if: ${{ !cancelled() }}
    needs: [mise, pre-commit, python, mesh-numeric]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  tag-release:
    needs: all
    if: github.repository == 'altendky/scansor' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    uses: ./.github/workflows/reflow-tag-release.yml
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  release:
    needs: all
    if: github.repository == 'altendky/scansor' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_ENABLED == 'true'
    uses: ./.github/workflows/reflow-release.yml
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
