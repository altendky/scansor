name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow_ref, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  python-versions:
    name: Python version pins
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
      primary: ${{ steps.versions.outputs.primary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read interpreter matrix from mise
        id: versions
        run: python3 -m experiments.ci_python_versions >> "$GITHUB_OUTPUT"

  mise:
    name: Mise
    uses: ./.github/workflows/reflow-mise.yml

  pre-commit:
    name: Pre-commit
    uses: ./.github/workflows/reflow-pre-commit.yml

  python:
    name: Python
    needs: python-versions
    uses: ./.github/workflows/reflow-python.yml
    with:
      python-versions: ${{ needs.python-versions.outputs.versions }}
      primary-python: ${{ needs.python-versions.outputs.primary }}

  browser:
    name: Browser
    needs: python-versions
    uses: ./.github/workflows/reflow-browser.yml
    with:
      primary-python: ${{ needs.python-versions.outputs.primary }}

  mesh-numeric:
    name: Mesh numerical conformance
    needs: python-versions
    uses: ./.github/workflows/reflow-mesh-numeric.yml
    with:
      python-versions: ${{ needs.python-versions.outputs.versions }}

  all:
    name: all
    if: ${{ !cancelled() }}
    needs: [python-versions, mise, pre-commit, python, browser, mesh-numeric]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  tag-release:
    needs: all
    if: github.repository == 'altendky/scansor' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    uses: ./.github/workflows/reflow-tag-release.yml
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  release:
    needs: all
    if: github.repository == 'altendky/scansor' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_ENABLED == 'true'
    uses: ./.github/workflows/reflow-release.yml
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
