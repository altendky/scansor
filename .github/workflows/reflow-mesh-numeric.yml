name: Mesh numerical conformance

on:
  workflow_call:
    inputs:
      python-versions:
        required: true
        type: string

permissions:
  contents: read

jobs:
  conformance:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    env:
      PYTHON_VERSION: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
        os: [Linux, Windows, Darwin]
        include:
          - os: Linux
            runner: ubuntu-24.04
            arch: x86_64
          - os: Windows
            runner: windows-2025
            arch: x86_64
          - os: Darwin
            runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5
        with:
          install_args: python uv

      - name: Install locked dependencies
        shell: bash
        run: uv sync --locked --python "$PYTHON_VERSION"

      - name: Verify architecture, numeric oracle, golden bytes, and dispatch
        env:
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/mesh-conformance
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        shell: bash
        run: >-
          uv run --locked --python "$PYTHON_VERSION" python
          -m experiments.mesh_numeric_conformance
          --output "$EVIDENCE_DIRECTORY"
          --expected-os "$EXPECTED_OS" --expected-arch "$EXPECTED_ARCH"

      - name: Upload actual conformance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mesh-conformance-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/mesh-conformance/*.json
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Compare all platform and dispatch identities
    needs: conformance
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5
        with:
          install_args: python

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mesh-conformance-*
          path: ${{ runner.temp }}/mesh-matrix

      - name: Require every expected report and identical semantic hashes
        env:
          MATRIX_DIRECTORY: ${{ runner.temp }}/mesh-matrix
        run: >-
          python -m experiments.mesh_numeric_conformance
          --output "$MATRIX_DIRECTORY" --compare-matrix
