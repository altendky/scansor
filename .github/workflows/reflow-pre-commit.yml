name: Pre-commit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          version: 2026.8.2
          sha256: 9a6c2a8b6fe77c98f1d210b4b3cbd2a0cf31886ad1baf10698757a3234c678c1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'mise.toml', 'mise.lock') }}

      - name: Run blocking checks
        run: pre-commit run --all-files --show-diff-on-failure --verbose

      - name: Check external links (advisory)
        continue-on-error: true
        run: pre-commit run lychee-external --all-files --hook-stage manual --verbose
