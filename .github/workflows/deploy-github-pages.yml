name: Manual browser deployment

on:
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: Successful push-to-main CI run ID
        required: true
        type: string
      artifact-id:
        description: Exact validated-static-browser artifact ID from that run
        required: true
        type: string
      archive-sha256:
        description: Reviewed artifact ZIP SHA-256 (without sha256 prefix)
        required: true
        type: string
      site-manifest-sha256:
        description: Reviewed site/manifest.json SHA-256
        required: true
        type: string
      publish:
        description: Publish only after separate artifact/domain authorization
        type: boolean
        default: false

permissions: {}

concurrency:
  group: scansor-github-pages
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify immutable trusted-main artifact
    if: >-
      github.repository == 'altendky/scansor' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      CI_RUN_ID: ${{ inputs.ci-run-id }}
      ARTIFACT_ID: ${{ inputs.artifact-id }}
      ARCHIVE_SHA256: ${{ inputs.archive-sha256 }}
      SITE_MANIFEST_SHA256: ${{ inputs.site-manifest-sha256 }}
      PUBLISH_REQUESTED: ${{ inputs.publish }}
      PUBLICATION_ENABLED: ${{ vars.SCANSOR_PAGES_PUBLICATION_ENABLED }}
    steps:
      - name: Enforce explicit publication gate and numeric API selection
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SITE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          if [[ "$PUBLISH_REQUESTED" == true && "$PUBLICATION_ENABLED" != true ]]; then
            echo 'Publication is disabled. Separate approval and Pages setup are required.' >&2
            exit 1
          fi
          SELECTION_DIRECTORY="$RUNNER_TEMP/agents/scansor-pages-selection"
          printf 'SELECTION_DIRECTORY=%s\n' "$SELECTION_DIRECTORY" >> "$GITHUB_ENV"
          mkdir -p "$SELECTION_DIRECTORY/locks"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          install_args: uv
          cache: false
          env: false

      - name: Download exact artifact and selected source locks as data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/altendky/scansor/actions/runs/$CI_RUN_ID" > "$SELECTION_DIRECTORY/run.json"
          gh api "repos/altendky/scansor/actions/artifacts/$ARTIFACT_ID" > "$SELECTION_DIRECTORY/artifact.json"
          SOURCE_SHA=$(jq -er '.head_sha' "$SELECTION_DIRECTORY/run.json")
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/altendky/scansor/actions/artifacts/$ARTIFACT_ID/zip" > "$SELECTION_DIRECTORY/artifact.zip"
          gh api "repos/altendky/scansor/contents/experiments/browser_runtime/runtime-lock.json?ref=$SOURCE_SHA" \
            -H 'Accept: application/vnd.github.raw+json' > "$SELECTION_DIRECTORY/locks/runtime-lock.json"
          gh api "repos/altendky/scansor/contents/scripts/browser-redistribution-lock.json?ref=$SOURCE_SHA" \
            -H 'Accept: application/vnd.github.raw+json' > "$SELECTION_DIRECTORY/locks/browser-redistribution-lock.json"
          gh api "repos/altendky/scansor/contents/experiments/browser_viewer/package-lock.json?ref=$SOURCE_SHA" \
            -H 'Accept: application/vnd.github.raw+json' > "$SELECTION_DIRECTORY/locks/package-lock.json"

      - name: Verify provenance, evidence, source obligations and exact bytes
        shell: bash
        run: |
          set -euo pipefail
          uv run scripts/validate-pages-artifact.py \
            --repository altendky/scansor --run-id "$CI_RUN_ID" --artifact-id "$ARTIFACT_ID" \
            --run "$SELECTION_DIRECTORY/run.json" --artifact "$SELECTION_DIRECTORY/artifact.json" \
            --archive "$SELECTION_DIRECTORY/artifact.zip" --archive-sha256 "$ARCHIVE_SHA256" \
            --site-manifest-sha256 "$SITE_MANIFEST_SHA256" --source-locks "$SELECTION_DIRECTORY/locks" \
            --output "$SELECTION_DIRECTORY/site" --evidence "$SELECTION_DIRECTORY/selection.json"
          cat "$SELECTION_DIRECTORY/selection.json" >> "$GITHUB_STEP_SUMMARY"

      # Dry runs stop here. This repackages the verified site without rebuilding
      # or modifying its entry, runtime, fixtures, manifests or notices.
      - name: Package the verified site for Pages
        if: ${{ inputs.publish && vars.SCANSOR_PAGES_PUBLICATION_ENABLED == 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/agents/scansor-pages-selection/site
          retention-days: 1

  deploy:
    name: Authorized manual publication
    needs: prepare
    if: >-
      inputs.publish && vars.SCANSOR_PAGES_PUBLICATION_ENABLED == 'true' &&
      github.repository == 'altendky/scansor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the previously verified Pages package
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
