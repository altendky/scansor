name: Tag release

on:
  workflow_call:
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    if: github.repository == 'altendky/scansor' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - run: uv run .github/scripts/release-github.py tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
