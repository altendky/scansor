name: Python

on:
  workflow_call:
    inputs:
      python-versions:
        required: true
        type: string
      primary-python:
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, and types
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: ${{ inputs.primary-python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5

      - name: Install dependencies
        run: uv sync --locked --python "$PYTHON_VERSION"

      - name: Check formatting
        run: uv run --locked --python "$PYTHON_VERSION" ruff format --check .

      - name: Check synchronized release versions
        run: uv run scripts/release-version.py check

      - name: Lint
        run: uv run --locked --python "$PYTHON_VERSION" ruff check .

      - name: Type check
        run: uv run --locked --python "$PYTHON_VERSION" basedpyright

  test:
    name: Test ${{ matrix.suite }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
        suite: [mesh, remaining]
    env:
      COVERAGE_FILE: coverage-data
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5

      - name: Install dependencies
        run: uv sync --locked --python "$PYTHON_VERSION"

      # Separate runners let these suites overlap and keep native CAD libraries
      # out of the serial mesh tests' memory-budgeted process.
      - name: Run memory-budgeted mesh tests
        if: ${{ matrix.suite == 'mesh' && matrix.python-version != inputs.primary-python }}
        run: uv run --locked --python "$PYTHON_VERSION" pytest tests/test_mesh*.py --durations=30

      - name: Run remaining tests
        if: ${{ matrix.suite == 'remaining' && matrix.python-version != inputs.primary-python }}
        # Bound numerical-library threads independently of pytest's process workers.
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: uv run --locked --python "$PYTHON_VERSION" pytest --ignore-glob='tests/test_mesh*.py' -n 4 --dist=worksteal --durations=30

      - name: Run memory-budgeted mesh tests with terminal coverage
        if: ${{ matrix.suite == 'mesh' && matrix.python-version == inputs.primary-python }}
        run: uv run --locked --python "$PYTHON_VERSION" pytest tests/test_mesh*.py --cov=scansor --cov-report=term-missing --durations=30

      - name: Run remaining tests with terminal coverage
        if: ${{ matrix.suite == 'remaining' && matrix.python-version == inputs.primary-python }}
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: uv run --locked --python "$PYTHON_VERSION" pytest --ignore-glob='tests/test_mesh*.py' -n 4 --dist=worksteal --cov=scansor --cov-report=term-missing --durations=30

      - name: Upload suite coverage data
        if: ${{ matrix.python-version == inputs.primary-python }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-${{ matrix.suite }}
          path: ${{ env.COVERAGE_FILE }}
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Combined coverage (Python ${{ inputs.primary-python }})
    needs: test
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: ${{ inputs.primary-python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          install_args: python uv

      - name: Install dependencies
        run: uv sync --locked --python "$PYTHON_VERSION"

      - name: Download mesh coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-coverage-mesh
          path: ${{ runner.temp }}/coverage/mesh

      - name: Download remaining coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-coverage-remaining
          path: ${{ runner.temp }}/coverage/remaining

      - name: Report combined terminal coverage
        env:
          COVERAGE_DIRECTORY: ${{ runner.temp }}/coverage
          COVERAGE_FILE: ${{ runner.temp }}/coverage-combined
        run: |
          uv run --locked --python "$PYTHON_VERSION" coverage combine \
            "$COVERAGE_DIRECTORY/mesh/coverage-data" \
            "$COVERAGE_DIRECTORY/remaining/coverage-data"
          uv run --locked --python "$PYTHON_VERSION" coverage report --show-missing
