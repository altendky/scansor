name: Python

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          version: 2026.8.2
          sha256: 9a6c2a8b6fe77c98f1d210b4b3cbd2a0cf31886ad1baf10698757a3234c678c1

      - name: Install dependencies
        run: uv sync --locked --python 3.12.13

      - name: Check formatting
        run: uv run --locked --python 3.12.13 ruff format --check .

      - name: Lint
        run: uv run --locked --python 3.12.13 ruff check .

      - name: Type check
        run: uv run --locked --python 3.12.13 basedpyright

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: 3.12.13
            coverage: true
          - python-version: 3.13.15
            coverage: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          version: 2026.8.2
          sha256: 9a6c2a8b6fe77c98f1d210b4b3cbd2a0cf31886ad1baf10698757a3234c678c1

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: uv run --locked --python ${{ matrix.python-version }} pytest

      - name: Run tests with terminal coverage
        if: ${{ matrix.coverage }}
        run: uv run --locked --python ${{ matrix.python-version }} pytest --cov=scansor --cov-report=term-missing
