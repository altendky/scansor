name: Python

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Install dependencies
        run: uv sync --locked --python 3.12.14

      - name: Check formatting
        run: uv run --locked --python 3.12.14 ruff format --check .

      - name: Check synchronized release versions
        run: uv run scripts/release-version.py check

      - name: Lint
        run: uv run --locked --python 3.12.14 ruff check .

      - name: Browser experiment checks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix experiments/browser_viewer
          npm run check --prefix experiments/browser_viewer

      - name: Type check
        run: uv run --locked --python 3.12.14 basedpyright

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: 3.12.14
            coverage: true
          - python-version: 3.13.15
            coverage: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: uv run --locked --python ${{ matrix.python-version }} pytest --durations=30

      - name: Run tests with terminal coverage
        if: ${{ matrix.coverage }}
        run: uv run --locked --python ${{ matrix.python-version }} pytest --cov=scansor --cov-report=term-missing --durations=30
