name: Browser

on:
  workflow_call:
    inputs:
      primary-python:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Checks and Chromium integration
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: ${{ inputs.primary-python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5

      - name: Install dependencies
        run: uv sync --locked --python "$PYTHON_VERSION"

      - name: Browser experiment checks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix experiments/browser_viewer
          npm run check --prefix experiments/browser_viewer
          npm run build --prefix experiments/browser_viewer

      - name: Browser workspace integration
        working-directory: experiments/browser_viewer
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
